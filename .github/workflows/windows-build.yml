name: NetScope Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create virtual environment
        shell: cmd
        run: py -3.12 -m venv .venv
      - name: Install project and build requirements
        shell: cmd
        run: .venv\Scripts\python.exe -m pip install -e ".[dev,gui,build]"
      - name: Run tests and package desktop app
        shell: cmd
        run: build_windows.cmd
      - name: Upload self-contained Windows folder
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-Windows-v0.6.0
          path: dist/NetScope/
          if-no-files-found: error
